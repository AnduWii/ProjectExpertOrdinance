name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm test
      # Ubuntu 24.04 blocks unprivileged user namespaces, which Chromium's
      # sandbox needs. The e2e suite runs sandboxed on purpose: Electron only
      # runs the MV3 service-worker preloads with the sandbox on.
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a -s "-screen 0 1440x900x24" npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-artifacts
          path: test/.tmp/
          if-no-files-found: ignore
          # test/.tmp is a dot-directory; upload-artifact skips those by default.
          include-hidden-files: true

  # Informational: installs the real Claude in Chrome from the live Web Store
  # and records what works. Never blocks the installer builds.
  claude-online:
    name: Claude in Chrome (live Web Store)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a -s "-screen 0 1440x900x24" node --test --test-reporter=spec test/e2e/09-claude-online.test.js
        env:
          ORDINANCE_ONLINE: '1'
          # Log each Web Store install step and its result code in the report.
          DEBUG: 'electron-chrome-web-store:*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: claude-online-report
          path: test/.tmp/
          if-no-files-found: ignore
          include-hidden-files: true

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            script: dist:win
          - name: macOS
            os: macos-15
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      # Browser-import detection on the real OS: macOS and Windows keep other
      # browsers' data in places the Linux test job can't exercise.
      - run: node --test test/unit/import-chrome.test.js
      - run: npm run ${{ matrix.script }}
        env:
          # electron-builder skips ALL signing on pull-request builds, even the
          # ad-hoc identity "-" that dist:mac asks for. An unsigned app is what
          # macOS reports as "damaged and can't be opened". Ad-hoc signing uses
          # no certificate or secret, so it is safe to force on pull requests.
          CSC_FOR_PULL_REQUEST: ${{ matrix.name == 'macOS' }}
      # Fail here instead of shipping an app macOS will call "damaged".
      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac/Chrome2.app dist/mac-arm64/Chrome2.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E '^(Executable|Identifier|Format|Signature)='
          done
      # The Linux e2e suite never runs the Mac build. Open it the way a
      # double-click does (LaunchServices) and require the window to appear
      # and the app to keep running, so "won't open" fails CI.
      - name: Open the macOS app (smoke test)
        if: runner.os == 'macOS'
        run: |
          app="$PWD/dist/mac-arm64/Chrome2.app"
          [ "$(uname -m)" = arm64 ] || app="$PWD/dist/mac/Chrome2.app"
          log="$HOME/Library/Application Support/Chrome2/logs/main.log"
          open "$app"
          for i in $(seq 1 45); do
            grep -q 'window shown' "$log" 2>/dev/null && break
            sleep 1
          done
          sleep 3
          echo "--- main.log"; cat "$log" 2>/dev/null || echo "(no log written)"
          grep -q 'window shown' "$log" 2>/dev/null || { echo "::error::Chrome2's window never appeared"; exit 1; }
          pgrep -x Chrome2 >/dev/null || { echo "::error::Chrome2 quit after opening"; exit 1; }
          echo "Chrome2 opened, showed its window and is still running"
          osascript -e 'quit app "Chrome2"' || pkill -x Chrome2 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome2-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
